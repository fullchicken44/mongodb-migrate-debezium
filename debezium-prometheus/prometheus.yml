global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka-connect'
    static_configs:
      - targets: ['kafka-connect:8080']
    scrape_interval: 5s
    metrics_path: /metrics

  - job_name: 'mongodb-comparison'
    static_configs:
      - targets: ['mongodb-comparison:8084']
    scrape_interval: 30s
    metrics_path: /metrics
